<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">

         <!-- Dados Pessoais -->

        <fieldset>
            <legend>Dados Pessoais</legend>

                <label for="name">Nome</label>
                <input id="name" type="text" name="username" required>
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" name="userage" min="12" max="100" required>
                <br>
                <label for="birthdate">Data de Nascimento</label>
                <input id="birthdate" type="date" name="birthdate">
                <br>
                <label for="email">Email</label>
                <input id="email" type="email" name="useremail" required>
                <br>
                <label for="phone">Telefone</label>
                <input id="phone" type="tel" name="phonenumber" pattern="[0-9] {11}" placeholder="(00)00000-0000">
                <br>
                <label for="userimage">Uploud de Foto</label>
                <input type="file" accept="image/*" name="userimage">
        </fieldset>

        <!-- Perfil -->
         
        <fieldset>
            <legend>Perfil</legend>

              <p>Gênero:</p>
              <input id="genderMasc" type="radio" name="usergender" value="Masculino">
              <label for="genderMasc">Masculino</label>

              <input id="genderFem" type="radio" name="usergender" value="Feminino">
              <label for="genderFem">Feminino</label>

              <input id="notInforGender" type="radio" name="usergender" value="notInformed">
              <label for="notInforGender">Prefiro nâo informar</label>
              <br>
            <label for="maritalStatus">Estado Civil</label>
            <select name="usermaritalStatus" id="maritalStatus">

                <option value="notInformed">Selecinone</option>
                <option value="casado">Casado(a)</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="Divorciado">Divorciado(a)</option>
                <option value="Viúvo">Viúvo(a)</option>

            </select>
            <label for="state">Estado</label>
            <select name="userState" id="state">

               <option value="notInformed">Selecinone</option>
               <option value="Acre">Acre</option>
               <option value="Alagoas">Alagoas</option>
               <option value="Amapá">Amapá</option>
               <option value="Amazonas">Amazonas</option>
               <option value="Bahia">Bahia</option>
               <option value="Ceará">Ceará</option>
               <option value="Distrito Federal">Distrito Federal</option>
               <option value="Espírito Santo">Espírito Santo</option>
               <option value="Goiás">Goiás</option>
               <option value="Maranhão">Maranhão</option>
               <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
               <option value="Mato Grosso">Mato Grosso</option>
               <option value="Minas Gerais">Minas Gerais</option>
               <option value="Pára">Pára</option>
               <option value="Paraíba">Paraíba</option>
               <option value="Paraná">Paraná</option>
               <option value="Pernambuco">Pernambuco</option>
               <option value="Piauí">Piauí</option>
               <option value="Rio de Janeiro">Rio de Janeiro</option>
               <option value="Rio Grande do Norte">Rio Grande do Norte</option>
               <option value="Rio Grande do Sul">Rio Grande do Sul</option>
               <option value="Rondônia">Rondônia</option>
               <option value="Roraima">Roraima</option>
               <option value="Santa Catarina">Santa Catarina</option>
               <option value="São Paulo">São Paulo</option>
               <option value="Sergipe">Sergipe</option>
               <option value="Tocantins">Tocantins</option>

            </select>
                <label for="City">Cidade</label>
                <input id="City" type="text" name="userCity">

        </fieldset>

                <!-- Habitos -->
    
        <fieldset>
            <legend>Hábitos</legend>
            <p>Redes Sociais:</p>
            <input id="instagram" type="checkbox" name="social" value="instagram">
            <label for="instagram">Instagram</label>
            <br>
            <input id="facebook" type="checkbox" name="social" value="facebook">
            <label for="facebook">Facebook</label>
            <br>
            <input id="linkedin" type="checkbox" name="social" value="linkedin">
            <label for="linkedin">Linkedin</label>
            <br>
            <input id="x" type="checkbox" name="social" value="x">
            <label for="x">X</label>
            <br>
            <input id="telegram" type="checkbox" name="social" value="telegram">
            <label for="telegram">Telegram</label>
            <br>
            <label for="musicStyle">Estilo de Musica</label>
            <input type="text" id="musicStyle" name="musicStyle" list="optionMuscic">
            <datalist id="optionMuscic">
                <option value="Forró"></option>
                <option value="Rap"></option>
                <option value="Reggae"></option>
                <option value="Pop"></option>
            </datalist>
            <br>
            <label for="favoriteColor">Cor Favorita</label>
            <input type="color" name="userFavoriteColor" id="favoriteColor">
        </fieldset>
        <fieldset>
               <!-- Opinião  -->
            <Legend>Opinião</Legend>
            <p>Qual sua opinião sobre nosso serviço?</p>

            <input type="radio" name="optionSatisfaction" id="optionExcellent" value="Ótimo">
            <label for="optionExcellent">Ótimo</label>

            <input type="radio" name="optionSatisfaction" id="optionGood" value="Bom">
            <label for="optionGood">Bom</label>

            <input type="radio" name="optionSatisfaction" id="optionRegular" value="Regular">
            <label for="optionRegular">Regular</label>

            <input type="radio" name="optionSatisfaction" id="optionPoor" value="Ruim">
            <label for="optionPoor">Ruim</label>
            <br>
            <label for="comment">Escreva um comentário</label>
            <textarea name="userComment" id="comment" placeholder="Digite aqui sua opinião..."></textarea>

        </fieldset>
        <!-- consentimento -->

        <fieldset>
            <legend>Confirmações</legend>

            <input type="checkbox" name="userLgpds" id="userLgpd" value="accept" required>
            <label for="userLgpd">Eu aceito participar da pesquisa</label><br>

            <input type="checkbox" name="userResult" id="userResultConf" value="accept" >
            <label for="userResultConf">Desejo receber o resultado por email</label>

        </fieldset>

                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
    </form>
    </section>
</body>
</html>
